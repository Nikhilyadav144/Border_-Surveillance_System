# ==========================================================================
# Threat scoring rules
# --------------------------------------------------------------------------
# IMPORTANT: this is a CONFIGURABLE PROTOTYPE RISK MODEL.
#
# The numbers below are engineering defaults chosen to make the demo
# behave sensibly. They are NOT derived from any military, police or
# international security standard, and they have not been validated against
# real incident data. Treat the output as a ranked triage hint for a human
# operator, never as an authoritative threat assessment.
# ==========================================================================

# Every factor adds its weight to a 0-100 score. The score is clamped at 100.
# Set a weight to 0 to switch a factor off without deleting it.
factors:
  restricted_zone_intrusion:
    weight: 30
    label: "Restricted zone intrusion"

  border_zone_intrusion:
    weight: 25
    label: "Border zone entry"

  no_vehicle_zone_violation:
    weight: 20
    label: "Vehicle in a no-vehicle zone"

  line_crossing:
    weight: 20
    label: "Virtual boundary crossed"

  # Two boundary factors, deliberately separate, because they are two
  # different claims about the same moment.
  #
  # `line_crossing` above fires when the tracker's reference point crossed a
  # configured line segment between two frames. That is geometry, and a box
  # that grows or jitters can produce it.
  #
  # `boundary_crossed` fires only when core/boundary_interaction.py has the
  # evidence chain behind it: the person was already engaged with THAT
  # boundary, and was afterwards observed on the opposite side. On CAM-01
  # that is the difference between a wobbling box and a man going over a
  # fence, and it is why the vault ends up HIGH while a bare intersection
  # on its own stays LOW.
  boundary_crossed:
    weight: 40
    label: "Security boundary crossed"

  # Climbing, vaulting or reaching for the boundary without having crossed
  # it yet. Worth flagging while it is still preventable.
  boundary_interacting:
    weight: 25
    label: "Physically engaging with the security boundary"

  # WHAT THE PERSON IS DOING.
  #
  # One weight per behaviour that core/behaviour_classifier.py can emit.
  # Until this table existed, behaviour contributed NOTHING to the score:
  # a person could be classified JUMPING and score zero unless they also
  # happened to cross a line or enter a zone. The label said one thing and
  # the risk model knew nothing about it.
  #
  # The numbers are chosen against the level thresholds below, not picked
  # for feel. HIGH begins at 50 and MEDIUM at 25, so:
  #
  #   JUMPING 50   reaches HIGH on its own, as border surveillance
  #                requires - going over something is the event this
  #                system exists to catch. Add a restricted zone (30) and
  #                it becomes 80, which is CRITICAL.
  #   CRAWLING 45  just short of HIGH alone: deliberate low movement, but
  #                one frame of a person bending to the ground looks the
  #                same, so it needs one corroborating factor to escalate.
  #   CROUCHING 30 MEDIUM alone, HIGH (60) with a zone intrusion. Crouching
  #                by itself is tying a shoelace as often as it is hiding.
  #   FALLING 30   MEDIUM. This is a welfare signal as much as a threat
  #                one; an operator should look, not scramble.
  #   RUNNING 25   MEDIUM. People run for innocent reasons constantly.
  #   BENT_RUN 25  travelling fast while folded over - measured on CAM-01
  #                at 3.0 body heights per second with the torso 75 degrees
  #                over, which is how somebody moves when they would rather
  #                not be seen above a barrier.
  #   BENT_WALK 15 the same shape at walking pace. This carries forward the
  #                exact weight the old `low_profile_movement` factor had,
  #                which this table replaces; keeping both would have
  #                double-counted the same observation.
  #   WALKING, STANDING, SITTING, BENDING, UNKNOWN: 0. Ordinary behaviour
  #                is not evidence of anything and must not drift a score
  #                upwards just by being classified.
  behaviour:
    label: "Behaviour"
    weights:
      JUMPING: 50
      CRAWLING: 45
      CROUCHING: 30
      FALLING: 30
      RUNNING: 25
      BENT_RUN: 25
      BENT_WALK: 15
      BENDING: 0
      WALKING: 0
      STANDING: 0
      SITTING: 0
      UNKNOWN: 0

  loitering:
    weight: 20
    label: "Loitering"

  # Extra points for every full minute of loitering beyond the threshold,
  # capped by loitering_duration_max.
  loitering_duration_per_minute: 5
  loitering_duration_max: 15

  behavioural_anomaly:
    weight: 15
    label: "Behavioural anomaly"

  unauthorised_vehicle:
    weight: 20
    label: "Unauthorised vehicle in a restricted area"

  watchlist_match:
    weight: 30
    label: "Watchlist match"

  # Fires on MEASURED scene darkness, not on the hour of day. See the
  # low_light section of application.yaml for the thresholds. The key is
  # still night_time so existing rule files keep working.
  night_time:
    weight: 10
    label: "Low-light conditions"

  group_presence:
    weight: 10
    label: "Group of three or more people"
    # Number of tracked people in frame that counts as a group.
    min_group_size: 3

  high_speed:
    weight: 10
    label: "Unusually fast movement"
    # Speed in fraction-of-frame-diagonal per second.
    threshold: 0.35

# Score to level mapping. Ranges are inclusive of the lower bound.
levels:
  LOW:      0
  MEDIUM:   25
  HIGH:     50
  CRITICAL: 75

# Incident types that are always at least this level, whatever the score.
# Useful when an event must never be buried, e.g. a watchlist hit.
minimum_levels:
  watchlist_match: "HIGH"
  restricted_zone_intrusion: "MEDIUM"
