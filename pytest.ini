[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
markers =
    slow: end-to-end tests that run the real detector (about a minute each)
    gui: tests that need Qt; they run headless under QT_QPA_PLATFORM=offscreen
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
